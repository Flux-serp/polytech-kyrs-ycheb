<!-- @dsCard group="B2B school" viewport="1440x900" name="B2B school — homepage" subtitle="Главная страница школы управления B2B-продажами" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Школа управления B2B-продажами — Политех</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="site.css"></head>
<body>
<div id="pre"></div>
<div id="root"></div>
<script>
(function(){var p=document.getElementById('pre');var cols=['var(--pt-green)','var(--pt-green-mid)','var(--pt-green-dark)','var(--pt-green)','var(--pt-violet)','var(--pt-green-mid)','var(--pt-orange)','var(--pt-green)','var(--pt-green-dark)','var(--pt-violet-dark)','var(--pt-green)','var(--pt-orange-light)'];
for(var r=0;r<4;r++)for(var c=0;c<6;c++){var i=document.createElement('i');i.style.background=cols[(r*7+c*5)%cols.length];i.style.transitionDelay=((c+r)*55)+'ms';p.appendChild(i);}
var im=document.createElement('img');im.src='../../assets/logo-short-white.png';im.alt='';p.appendChild(im);
var t=localStorage.getItem('pt-b2b-theme');if(t)document.documentElement.dataset.theme=t;
if(localStorage.getItem('pt-b2b-lv'))document.documentElement.setAttribute('data-lv','');})();
</script>
<script type="text/babel" src="B2BHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Courses.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="B2BFooter.jsx"></script>
<script type="text/babel" src="Overlays.jsx"></script>
<script type="text/babel">
function App(){
  const {Toast}=window.DesignSystem_a62ddd;
  const [theme,setTheme]=React.useState(localStorage.getItem('pt-b2b-theme')||'light');
  const [lv,setLv]=React.useState(!!localStorage.getItem('pt-b2b-lv'));
  const [lang,setLang]=React.useState(localStorage.getItem('pt-b2b-lang')||'ru');
  const [search,setSearch]=React.useState(false),[cab,setCab]=React.useState(false),[menu,setMenu]=React.useState(false);
  const [toast,setToast]=React.useState(null);const [active,setActive]=React.useState('home');
  const t=window.B2B.i18n[lang];
  React.useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem('pt-b2b-theme',theme);},[theme]);
  React.useEffect(()=>{document.documentElement.toggleAttribute('data-lv',lv);lv?localStorage.setItem('pt-b2b-lv','1'):localStorage.removeItem('pt-b2b-lv');},[lv]);
  React.useEffect(()=>{document.documentElement.lang=lang;localStorage.setItem('pt-b2b-lang',lang);},[lang]);
  React.useEffect(()=>{document.body.style.overflow=search||menu?'hidden':'';},[search,menu]);
  React.useEffect(()=>{const pre=document.getElementById('pre');const s=setTimeout(()=>{pre.classList.add('done');document.documentElement.classList.add('ready');setTimeout(()=>pre.remove(),1400);},lv?0:550);return ()=>clearTimeout(s);},[]);
  React.useEffect(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
    const scan=()=>document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el));scan();const s=setTimeout(scan,300);return ()=>{io.disconnect();clearTimeout(s);};},[lang,lv]);
  React.useEffect(()=>{const on=()=>{let cur='home';window.B2B.nav.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<window.innerHeight*.45)cur=id;});if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur='contacts';setActive(cur);};on();window.addEventListener('scroll',on,{passive:true});return ()=>window.removeEventListener('scroll',on);},[]);
  const go=id=>{const el=document.getElementById(id);if(!el)return;const y=id==='home'?0:el.getBoundingClientRect().top+window.scrollY-63;window.scrollTo({top:y,behavior:lv?'auto':'smooth'});};
  const wipe=fn=>{if(document.startViewTransition&&!lv)document.startViewTransition(()=>ReactDOM.flushSync(fn));else fn();};
  const notify=(title,text)=>{setToast({title,text});clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),4000);};
  const page=n=>{if(n==='courses')location.href='courses.html';else if(n==='corporate')location.href='corporate.html';else go(n);};
  React.useEffect(()=>{const h=location.hash.slice(1);if(h&&window.B2B.nav.includes(h))setTimeout(()=>go(h),700);},[]);
  const ctx={t,lang,theme,lv,active,search,cab,menu,go,page,notify,
    toggleTheme:()=>wipe(()=>setTheme(theme==='dark'?'light':'dark')),
    toggleLang:()=>wipe(()=>setLang(lang==='ru'?'en':'ru')),
    toggleLv:()=>setLv(!lv),
    openSearch:()=>setSearch(true),closeSearch:()=>setSearch(false),
    openCab:()=>setCab(true),closeCab:()=>setCab(false),toggleMenu:()=>setMenu(!menu)};
  return <>
    <SiteHeader ctx={ctx}/>
    <MobileMenu ctx={ctx}/>
    <SectionRail ctx={ctx}/>
    <main>
      <Hero ctx={ctx}/>
      <Marquee ctx={ctx}/>
      <Courses ctx={ctx}/>
      <Steps ctx={ctx}/>
      <Corporate ctx={ctx}/>
      <About ctx={ctx}/>
    </main>
    <SiteFooter ctx={ctx}/>
    <SearchOverlay ctx={ctx}/>
    <CabinetDialog ctx={ctx}/>
    <CookieBar ctx={ctx}/>
    {toast&&<div className="toastw"><Toast title={toast.title} onClose={()=>setToast(null)}>{toast.text}</Toast></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
