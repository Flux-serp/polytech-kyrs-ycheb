<style>
:root{--bg:#fff;--fg:#000;--muted:var(--pt-grey-600);--line:#000;--line-soft:var(--pt-grey-200);--soft:var(--pt-grey-50);--card:#fff;--hdr:84px}
[data-theme=dark]{--bg:#000;--fg:#fff;--muted:var(--pt-grey-400);--line:#fff;--line-soft:var(--pt-grey-900);--soft:#141414;--card:#0c0c0c}
[data-lv]{--muted:var(--fg);--line-soft:var(--fg)}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);transition:background .4s,color .4s;overflow-x:hidden}
a{color:inherit}a:hover{color:var(--pt-green)}
[data-lv] #root{zoom:1.2}
[data-lv] *,[data-lv] *::before,[data-lv] *::after{transition:none!important;animation:none!important}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.h2{margin:0;font:800 clamp(34px,4.2vw,60px)/.98 var(--font-display);text-transform:uppercase;letter-spacing:-.005em}
.h2-inv{color:#fff}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease-standard),transform .9s var(--ease-standard)}
.rv.in{opacity:1;transform:none}
[data-lv] .rv{opacity:1;transform:none}
/* preloader */
#pre{position:fixed;inset:0;z-index:2000;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}
#pre i{display:block;transform-origin:top;transition:transform .7s cubic-bezier(.7,0,.2,1)}
#pre.done i{transform:scaleY(0)}
#pre img{position:fixed;left:50%;top:50%;width:260px;transform:translate(-50%,-50%);transition:opacity .3s}
#pre.done img{opacity:0}
/* header */
.hdr{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);transition:background .4s}
.hdr-in{height:var(--hdr);display:flex;align-items:center;gap:32px;transition:height .3s var(--ease-standard)}
.hdr-sc .hdr-in{height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);flex:none}
.brand:hover{color:var(--fg)}
.brand-div{width:1px;height:30px;background:var(--line)}
.brand-name{font:600 12px/1.15 var(--font-sans);text-transform:uppercase}
.nav{display:flex;gap:26px;flex:1;justify-content:center}
.nav a{white-space:nowrap}
.tools{display:flex;gap:2px}
.ibtn{height:40px;min-width:40px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--fg);cursor:pointer;transition:border-color .2s,background .2s}
.ibtn:hover{border-color:var(--fg)}
.ibtn[data-active]{background:var(--pt-green);color:#fff;border-color:var(--pt-green)}
.ibtn-lang{font:700 12px var(--font-sans)}
.burger{display:none}
.hdr-bar{height:3px;position:absolute;left:0;right:0;bottom:-2px;overflow:hidden}
.hdr-bar-fill{height:100%;background:var(--grad-triad-stripe);transform-origin:left;transform:scaleX(0)}
.mmenu{position:fixed;inset:64px 0 0;z-index:99;background:var(--bg);padding:32px 24px;display:flex;flex-direction:column;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}
.mmenu.open{clip-path:inset(0)}
.mmenu a{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line-soft);font:800 30px/1 var(--font-display);text-transform:uppercase;text-decoration:none;opacity:0;transform:translateY(20px);transition:opacity .4s,transform .4s}
.mmenu.open a{opacity:1;transform:none}
.mm-i{font:600 13px var(--font-sans);color:var(--pt-green)}
.rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:10px}
.rail-i{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--fg)}
.rail-b{width:10px;height:10px;background:var(--line-soft);transition:width .3s var(--ease-standard),background .3s}
.rail-i.on .rail-b{width:28px;background:var(--pt-green)}
.rail-l{font:600 11px var(--font-sans);text-transform:uppercase;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;background:var(--bg);padding:2px 4px}
.rail-i:hover .rail-l{opacity:1;transform:none}
/* hero */
.hero{position:relative;min-height:calc(100vh - var(--hdr));display:flex;flex-direction:column;overflow:hidden}
.pi-tex{position:absolute;inset:0;padding:24px;font:400 13px/2.1 var(--font-sans);letter-spacing:.9em;color:var(--fg);opacity:.06;word-break:break-all;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 75%);mask-image:linear-gradient(90deg,transparent 30%,#000 75%)}
.hero-cv{position:absolute;right:0;top:0;width:58%;height:100%;display:block;cursor:crosshair}
.hero-in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-top:56px;padding-bottom:40px;pointer-events:none;width:100%}
.hero-in>*{pointer-events:auto;max-width:720px}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 13px var(--font-sans);text-transform:uppercase;color:var(--muted)}
.sq{width:10px;height:10px;background:var(--pt-green);flex:none}
.h-hero{margin:0;font:800 clamp(52px,7.4vw,124px)/.92 var(--font-display);text-transform:uppercase;letter-spacing:-.01em}
.ln{display:block;overflow:hidden;padding-bottom:.04em}
.ln>span{display:block;transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
html.ready .ln>span{transform:none}
.h-block{display:inline-block;background:var(--grad-green-block);color:#fff;padding:0 .12em;font-weight:800}
.lead{margin:0;font:300 clamp(17px,1.5vw,22px)/1.35 var(--font-display);text-transform:uppercase;color:var(--fg);max-width:620px}
.hint{display:flex;align-items:center;gap:8px;font:500 12px var(--font-sans);color:var(--muted);text-transform:uppercase}
.facts-wrap{position:relative;z-index:2;width:100%}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg)}
.fact{padding:20px 24px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
.fact-a{font:800 22px/1.05 var(--font-display);text-transform:uppercase}
.fact-s{font:400 14px/1.35 var(--font-ui);color:var(--muted);margin-top:6px}
.fact-hot .fact-s{color:#000;margin:0 0 4px}
.fact-big{font:800 34px/1 var(--font-display)}
/* marquee */
.mq{background:var(--fg);color:var(--bg);overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-row{display:flex}
.mq-i{display:flex;align-items:center;gap:18px;padding:22px 28px;font:800 22px var(--font-display);text-transform:uppercase;white-space:nowrap}
.mq-sq{width:14px;height:14px;flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
/* courses */
.courses{position:relative}
.courses-pin{position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;gap:28px;overflow:hidden;padding:24px 0}
.courses-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;width:100%}
.h2-n{display:inline-block;font:600 16px var(--font-sans);vertical-align:top;margin-right:12px;color:var(--pt-green);transform:translateY(6px)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.courses-vp{width:100%;overflow:visible}
.track{display:flex;gap:24px;will-change:transform;width:max-content}
.ccard{width:380px;flex:none;background:var(--card);border:1px solid var(--line-soft);display:flex;flex-direction:column;transition:transform .25s var(--ease-standard),border-color .25s;transform-style:preserve-3d;--gx:50%}
.ccard:hover{border-color:var(--fg)}
.ccard-top{height:170px;display:flex;justify-content:space-between;align-items:flex-start;background-size:180% 180%!important;background-position:var(--gx) 50%!important;transition:background-position .3s}
.ccard-n{font:800 72px/.85 var(--font-display)}
.ccard-w{align-self:flex-end;font:400 14px var(--font-sans);text-transform:uppercase}
.ccard-w b{font:800 34px var(--font-display)}
.ccard-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.ccard-meta{display:flex;gap:10px;align-items:center}
.ccard-cat{font:600 12px var(--font-sans);text-transform:uppercase;color:var(--muted)}
.ccard-t{margin:0;font:800 22px/1.05 var(--font-display);text-transform:uppercase;min-height:2.1em}
.ccard-d{margin:0;font:400 15px/1.5 var(--font-ui);color:var(--muted)}
.ccard-f{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;font:400 14px var(--font-sans)}
.courses-foot{display:flex;align-items:center;gap:24px;width:100%}
.prog{flex:1;height:2px;background:var(--line-soft)}
.prog-f{height:100%;background:var(--pt-green);transform-origin:left;transform:scaleX(0)}
.courses-hint{font:500 12px var(--font-sans);text-transform:uppercase;color:var(--muted)}
/* steps */
.steps{display:grid;grid-template-columns:5fr 7fr;gap:64px;padding-top:120px;padding-bottom:40px}
.steps-sticky{position:sticky;top:120px;display:flex;flex-direction:column;gap:32px}
.steps-num{width:220px;height:220px;background:var(--grad-green-block);color:#fff;display:flex;align-items:flex-end;padding:18px;overflow:hidden}
.steps-num-in{font:800 150px/.8 var(--font-display);animation:numIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes numIn{from{transform:translateY(100%)}to{transform:none}}
.steps-bar{display:flex;gap:6px}
.steps-bar span{width:48px;height:8px;background:var(--line-soft);transition:background .3s}
.steps-bar span.on{background:var(--pt-green)}
.step{min-height:56vh;border-top:1px solid var(--line);padding-top:28px;opacity:.28;transition:opacity .4s}
.step.on{opacity:1}
.step-k{font:600 13px var(--font-sans);color:var(--pt-green)}
.step-t{margin:14px 0 16px;font:800 clamp(30px,3.4vw,48px)/1 var(--font-display);text-transform:uppercase}
.step-d{margin:0;max-width:520px;font:300 20px/1.4 var(--font-display)}
/* corporate */
.corp{padding-top:120px}
.corp-blk{will-change:clip-path}
.corp-in{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);min-height:560px}
.corp-txt{padding:56px;display:flex;flex-direction:column;gap:24px}
.corp-lead{margin:0;font:300 20px/1.4 var(--font-display);color:#fff;max-width:540px}
.corp-list{list-style:none;margin:auto 0 0;padding:0;border-top:1px solid rgba(255,255,255,.6)}
.corp-list li{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.6);font:700 18px var(--font-display);text-transform:uppercase;color:#fff}
.corp-list li>span:last-child{margin-left:auto}
.corp-i{font:600 13px var(--font-sans);width:24px}
.corp-3d{position:relative;min-height:360px}
.corp-3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.corp-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:32px 56px 36px;background:#fff;color:#000;border:1px solid var(--line-soft);border-top:0}
.corp-form-f{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;padding-top:120px;align-items:start}
.about-img{position:relative;overflow:hidden}
.about-ph{aspect-ratio:1/1;background:url(../../assets/photo-students-laptop.jpg) 70% center/cover;transform:scale(1.12);transition:transform 1.6s var(--ease-standard)}
.about-img.in .about-ph{transform:none}
.curtain{position:absolute;inset:0 0 10px 0;background:var(--grad-green-block);transform-origin:right;transition:transform 1.1s cubic-bezier(.7,0,.2,1) .15s}
.about-img.in .curtain{transform:scaleX(0)}
.about-txt{display:flex;flex-direction:column;gap:32px;padding-top:12px}
.about-p{margin:0;font:300 22px/1.4 var(--font-display)}
.counters{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.cnt{padding:22px 16px 0 0}
.cnt+.cnt{border-left:1px solid var(--line);padding-left:20px}
.cnt-n{font:800 clamp(40px,4vw,60px)/1 var(--font-display)}
.cnt-l{font:400 14px var(--font-ui);color:var(--muted);margin-top:8px}
/* footer */
.ftr{background:#000;color:#fff;margin-top:140px;--fg:#fff;--bg:#000;--line:#fff;--line-soft:#454343;--muted:#a6a6a6}
.ftr a{color:#fff;text-decoration:none}.ftr a:hover{color:var(--pt-green)}
.ftr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding:56px 0 40px;border-bottom:1px solid #454343}
.ftr-brand{display:flex;flex-direction:column;gap:18px}
.ftr-school{font:600 13px var(--font-sans);text-transform:uppercase}
.ftr-cta{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.ftr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;padding:40px 0}
.ftr-h{font:700 13px var(--font-sans);text-transform:uppercase;color:var(--pt-green);margin-bottom:16px}
.ftr-ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font:400 15px/1.45 var(--font-ui)}
.ftr-dim{color:#a6a6a6}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.soc-i{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 12px;border:1px solid #454343;font:600 14px var(--font-sans);transition:border-color .2s,background .2s}
.soc-i:hover{border-color:#fff;background:#fff;color:#000!important}
.ftr-legal{border-top:1px solid #454343;padding:24px 0;display:grid;gap:6px}
.ftr-legal p{margin:0;font:400 13px/1.5 var(--font-ui);color:#a6a6a6}
.ftr-bot{display:flex;gap:28px;flex-wrap:wrap;align-items:center;padding:18px 0 28px;border-top:1px solid #454343;font:400 13px var(--font-sans)}
.ftr-slogan{margin-left:auto;text-transform:uppercase;letter-spacing:var(--ls-spaced);font-size:11px}
/* overlays */
.srch{position:fixed;inset:0;z-index:500;background:var(--bg);color:var(--fg);clip-path:inset(0 0 100% 0);transition:clip-path .6s cubic-bezier(.7,0,.2,1);overflow:auto}
.srch.open{clip-path:inset(0)}
.srch-top{display:flex;align-items:center;gap:18px;padding:48px 0 18px;border-bottom:2px solid var(--fg)}
.srch-in{flex:1;border:0;background:none;outline:none;color:var(--fg);font:800 clamp(28px,4vw,56px) var(--font-display);text-transform:uppercase;min-width:0}
.srch-in::placeholder{color:var(--line-soft)}
.srch-res{display:flex;flex-direction:column;padding:12px 0 48px}
.srch-r{display:grid;grid-template-columns:60px 1fr auto 24px;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line-soft);text-decoration:none;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s,background .2s}
.srch.open .srch-r{opacity:1;transform:none}
.srch-r:hover{color:var(--pt-green)}
.srch-n{font:800 22px var(--font-display);color:var(--pt-green)}
.srch-t{font:700 20px var(--font-display);text-transform:uppercase}
.srch-empty{padding:32px 0;color:var(--muted);font:300 22px var(--font-display)}
.cookie{position:fixed;left:24px;bottom:24px;z-index:400;max-width:440px;background:#000;color:#fff;padding:18px 20px;display:flex;gap:18px;align-items:center;border-left:8px solid var(--pt-green);box-shadow:var(--shadow-overlay);animation:ckIn .5s var(--ease-standard)}
[data-theme=dark] .cookie{background:#fff;color:#000}
.cookie p{margin:0;font:400 13px/1.45 var(--font-ui)}
.cookie a{color:inherit;text-decoration:underline}
@keyframes ckIn{from{transform:translateY(120%)}to{transform:none}}
.toastw{position:fixed;right:24px;bottom:24px;z-index:1100;animation:ckIn .4s var(--ease-standard)}
/* view transitions — square wipe on theme change */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vtw .75s cubic-bezier(.7,0,.2,1)}
@keyframes vtw{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@media(max-height:760px){.ccard-top{height:110px}.ccard-n{font-size:52px}.ccard-d{display:none}.courses-pin{gap:18px}}
@media(max-width:1180px){.hero-cv{width:78%;opacity:.5}.lead{max-width:520px}.soc{grid-template-columns:1fr}.nav{display:none}.burger{display:block}.tools .ibtn{min-width:36px;padding:0 6px}.rail{display:none}}
@media(max-width:900px){
.wrap{padding:0 20px}.hdr-in{gap:12px}.brand-name,.brand-div{display:none}.hdr .tools{display:none}

<body><template id="__bundler_thumbnail" data-bg-color="#00b140"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect x="420" y="250" width="360" height="300" fill="#fff"/><text x="600" y="455" font-family="Arial" font-weight="800" font-size="150" text-anchor="middle" fill="#00b140">B2B</text></svg></template>
<div id="pre"></div>
<div id="root"></div>
<script>
(function(){var p=document.getElementById('pre');var cols=['var(--pt-green)','var(--pt-green-mid)','var(--pt-green-dark)','var(--pt-green)','var(--pt-violet)','var(--pt-green-mid)','var(--pt-orange)','var(--pt-green)','var(--pt-green-dark)','var(--pt-violet-dark)','var(--pt-green)','var(--pt-orange-light)'];
for(var r=0;r<4;r++)for(var c=0;c<6;c++){var i=document.createElement('i');i.style.background=cols[(r*7+c*5)%cols.length];i.style.transitionDelay=((c+r)*55)+'ms';p.appendChild(i);}
var im=document.createElement('img');im.src=(window.__resources&&window.__resources['logo-short-white'])||'../../assets/logo-short-white.png';im.alt='';p.appendChild(im);
var t=localStorage.getItem('pt-b2b-theme');if(t)document.documentElement.dataset.theme=t;
if(localStorage.getItem('pt-b2b-lv'))document.documentElement.setAttribute('data-lv','');})();
</script>
<script type="text/babel" src="B2BHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Courses.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="B2BFooter.jsx"></script>
<script type="text/babel" src="Overlays.jsx"></script>
<script type="text/babel">
function App(){
  const {Toast}=window.DesignSystem_a62ddd;
  const [theme,setTheme]=React.useState(localStorage.getItem('pt-b2b-theme')||'light');
  const [lv,setLv]=React.useState(!!localStorage.getItem('pt-b2b-lv'));
  const [lang,setLang]=React.useState(localStorage.getItem('pt-b2b-lang')||'ru');
  const [search,setSearch]=React.useState(false),[cab,setCab]=React.useState(false),[menu,setMenu]=React.useState(false);
  const [toast,setToast]=React.useState(null);const [active,setActive]=React.useState('home');
  const t=window.B2B.i18n[lang];
  React.useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem('pt-b2b-theme',theme);},[theme]);
  React.useEffect(()=>{document.documentElement.toggleAttribute('data-lv',lv);lv?localStorage.setItem('pt-b2b-lv','1'):localStorage.removeItem('pt-b2b-lv');},[lv]);
  React.useEffect(()=>{document.documentElement.lang=lang;localStorage.setItem('pt-b2b-lang',lang);},[lang]);
  React.useEffect(()=>{document.body.style.overflow=search||menu?'hidden':'';},[search,menu]);
  React.useEffect(()=>{const pre=document.getElementById('pre');const s=setTimeout(()=>{pre.classList.add('done');document.documentElement.classList.add('ready');setTimeout(()=>pre.remove(),1400);},lv?0:550);return ()=>clearTimeout(s);},[]);
  React.useEffect(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
    const scan=()=>document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el));scan();const s=setTimeout(scan,300);return ()=>{io.disconnect();clearTimeout(s);};},[lang,lv]);
  React.useEffect(()=>{const on=()=>{let cur='home';window.B2B.nav.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<window.innerHeight*.45)cur=id;});if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur='contacts';setActive(cur);};on();window.addEventListener('scroll',on,{passive:true});return ()=>window.removeEventListener('scroll',on);},[]);
  const go=id=>{const el=document.getElementById(id);if(!el)return;const y=id==='home'?0:el.getBoundingClientRect().top+window.scrollY-63;window.scrollTo({top:y,behavior:lv?'auto':'smooth'});};
  const wipe=fn=>{if(document.startViewTransition&&!lv)document.startViewTransition(()=>ReactDOM.flushSync(fn));else fn();};
  const notify=(title,text)=>{setToast({title,text});clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),4000);};
  const ctx={t,lang,theme,lv,active,search,cab,menu,go,notify,
    toggleTheme:()=>wipe(()=>setTheme(theme==='dark'?'light':'dark')),
    toggleLang:()=>wipe(()=>setLang(lang==='ru'?'en':'ru')),
    toggleLv:()=>setLv(!lv),
    openSearch:()=>setSearch(true),closeSearch:()=>setSearch(false),
    openCab:()=>setCab(true),closeCab:()=>setCab(false),toggleMenu:()=>setMenu(!menu)};
  return <>
    <SiteHeader ctx={ctx}/>
    <MobileMenu ctx={ctx}/>
    <SectionRail ctx={ctx}/>
    <main>
      <Hero ctx={ctx}/>
      <Marquee ctx={ctx}/>
      <Courses ctx={ctx}/>
      <Steps ctx={ctx}/>
      <Corporate ctx={ctx}/>
      <About ctx={ctx}/>
    </main>
    <SiteFooter ctx={ctx}/>
    <SearchOverlay ctx={ctx}/>
    <CabinetDialog ctx={ctx}/>
    <CookieBar ctx={ctx}/>
    {toast&&<div className="toastw"><Toast title={toast.title} onClose={()=>setToast(null)}>{toast.text}</Toast></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
