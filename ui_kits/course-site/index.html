<!-- @dsCard group="Course site" viewport="1280x900" name="Course website" subtitle="Главная, программа, занятие, запись" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Политех — курс</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
<script type="text/babel" src="CourseHeader.jsx"></script><script type="text/babel" src="CourseFooter.jsx"></script><script type="text/babel" src="HomeScreen.jsx"></script><script type="text/babel" src="ProgramScreen.jsx"></script><script type="text/babel" src="LessonScreen.jsx"></script><script type="text/babel" src="EnrollDialog.jsx"></script>
<style>body{margin:0}</style></head><body><div id="root"></div>
<script type="text/babel">
function App(){
 const {Toast}=window.DesignSystem_a62ddd;
 const [page,setPage]=React.useState(localStorage.getItem('pt-course-page')||'home');
 const [dlg,setDlg]=React.useState(false);const [toast,setToast]=React.useState(false);
 const go=p=>{setPage(p);localStorage.setItem('pt-course-page',p);window.scrollTo(0,0)};
 const done=()=>{setDlg(false);setToast(true);setTimeout(()=>setToast(false),3500)};
 return <div data-screen-label={page}>
  <SiteHeader page={page} go={go} onEnroll={()=>setDlg(true)}/>
  {page==='home'&&<HomeScreen go={go} onEnroll={()=>setDlg(true)}/>}
  {page==='program'&&<ProgramScreen go={go}/>}
  {page==='lesson'&&<LessonScreen go={go}/>}
  <SiteFooter/>
  <EnrollDialog open={dlg} onClose={()=>setDlg(false)} onDone={done}/>
  {toast&&<div style={{position:'fixed',right:24,bottom:24,zIndex:1100}}><Toast title="Заявка отправлена" onClose={()=>setToast(false)}>Ссылка на курс придёт на почту</Toast></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
